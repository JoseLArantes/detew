[workspace]
members = [
  "crates/detew-domain",
  "crates/detew-policy",
  "crates/detew-reference",
  "crates/detew-schema-gen",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/JoseLArantes/detew"

[workspace.dependencies]
schemars = { version = "=1.2.3", default-features = false, features = ["derive", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
